name: Обновить цены и сайт

on:
  schedule:
    - cron: "0 * * * *"   # каждый час в :00 (часовой пояс Новосибирска сдвинут на целые часы, минуты те же)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright beautifulsoup4 && playwright install --with-deps chromium
      - run: python scrape.py && python build_data.py
      - name: Сохранить обновлённые данные
        run: |
          git config user.name "sbc-bot"
          git config user.email "sbc-bot@users.noreply.github.com"
          git add raw.json docs/data.json
          git diff --cached --quiet || git commit -m "Обновить цены"
          git push

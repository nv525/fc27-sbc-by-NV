name: Собрать базу игроков

on:
  schedule:
    - cron: "30 */3 * * *"   # каждые 3 часа в :30, пока база не накопится
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright beautifulsoup4 && playwright install --with-deps chromium
      - run: python scrape_players.py && python build_players.py && python build_data.py
      - name: Сохранить базу
        run: |
          git config user.name "sbc-bot"
          git config user.email "sbc-bot@users.noreply.github.com"
          git add players_db.json docs/players.json docs/data.json
          git diff --cached --quiet || git commit -m "Дополнить базу игроков"
          git pull --rebase
          git push

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  /* Макет: компактная шапка, ряд управления в виде таблеток, ниже спокойные карточки без рамок.
     Один акцент — цвет кристалла из иконки; всё остальное нейтральное. */
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #eceef1;
    --fg: #12161b;
    --muted: #6a7482;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f12; --surface: #15181d; --surface-2: #1d2128; --fg: #eef1f4; --muted: #8a94a2;
      --line: rgba(255, 255, 255, 0.07); --accent: #5fd3b4; --accent-soft: rgba(95, 211, 180, 0.14);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f12; --surface: #15181d; --surface-2: #1d2128; --fg: #eef1f4; --muted: #8a94a2;
    --line: rgba(255, 255, 255, 0.07); --accent: #5fd3b4; --accent-soft: rgba(95, 211, 180, 0.14);
    color-scheme: dark;

  * { box-sizing: border-box; }
  body {

    font: 500 15px/1.45 var(--font);
    font-variant-numeric: tabular-nums;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1160px; margin: 0 auto; }
  h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.035em; margin: 0 0 6px; text-wrap: balance; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .seg { display: inline-flex; gap: 2px; background: var(--surface); border-radius: 999px; padding: 4px; }
  .seg button {
    font: 700 0.84rem var(--font); color: var(--muted); background: none; border: 0;

  input[type="search"], select {

    border: 0; border-radius: 999px; padding: 11px 18px; min-width: 0;
  }

  select { padding-right: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .upd { color: var(--muted); font-size: 0.78rem; margin: 0 0 22px 4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
  .card { background: var(--surface); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .art { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }

  .big { font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; color: var(--accent); line-height: 1; }

  }

  .build { display: flex; flex-direction: column; gap: 10px; }

  button.link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .art[data-open] { cursor: pointer; }
  .tag { position: absolute; top: 10px; left: 10px; z-index: 2; font: 700 0.68rem var(--font); background: rgba(0, 0, 0, 0.55); color: #fff; padding: 3px 9px; border-radius: 999px; backdrop-filter: blur(6px); }

  .dt { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
  .dt-in {
    max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .dt .art::after { display: none; }
  .panel { background: var(--surface); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel h3 { margin: 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .dt h2.title { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; overflow-wrap: anywhere; }

  .dd { position: relative; flex: 0 0 auto; }
  .dd-b { position: relative; font: 600 0.88rem var(--font); color: var(--fg); background: var(--surface); border: 0; border-radius: 999px; height: 42px; padding: 0 40px 0 18px; cursor: pointer; text-align: left; white-space: nowrap; }
  .dd-b::after { content: ""; position: absolute; right: 18px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); transition: transform 0.15s; }

  .dd-m { position: absolute; z-index: 70; left: 0; top: calc(100% + 6px); min-width: 100%; max-width: 86vw; max-height: min(60vh, 380px); overflow-y: auto; margin: 0; padding: 6px; list-style: none; background: var(--surface); border-radius: 20px; box-shadow: 0 14px 36px rgba(0, 0, 0, 0.18), 0 0 0 1px var(--surface-2); }
  .dd-m button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 10px 14px; border-radius: 14px; cursor: pointer; font: 600 0.88rem var(--font); color: var(--fg); white-space: nowrap; }
  .dd-m button:hover, .dd-m button:focus-visible { background: var(--accent-soft); }
  .dd-m button[aria-selected="true"] { color: var(--accent); }
  .cardstage { display: grid; place-items: center; padding: 20px 12px; border-radius: 20px; background: radial-gradient(circle at 50% 35%, var(--accent-soft), transparent 70%), var(--surface-2); }
  .cardimg { width: clamp(150px, 52vw, 230px); height: auto; filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.28)); }
  .psg { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
  .ps { display: flex; align-items: center; gap: 10px; min-width: 0; background: var(--surface-2); border-radius: 14px; padding: 9px 12px; font-weight: 700; font-size: 0.82rem; }
  .ps svg { width: 22px; height: 22px; flex: none; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .warn { margin: 0; padding: 10px 14px; border-radius: 14px; background: var(--accent-soft); color: var(--fg); font-size: 0.85rem; font-weight: 600; }
  .plhead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px 16px; align-items: center; }
  .plrate { font-size: 3.4rem; font-weight: 800; letter-spacing: -0.06em; line-height: 0.9; color: var(--accent); }
  .plpos { font-weight: 800; font-size: 0.95rem; margin-top: 4px; }
  .plmain { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .plname { font-size: clamp(1.1rem, 4.6vw, 1.45rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
  .facts .chip { white-space: nowrap; }
  .plimg { width: clamp(64px, 20vw, 92px); }
  .plimg img { width: 100%; height: auto; display: block; }

  .six div { background: var(--surface-2); border-radius: 14px; padding: 9px 4px; text-align: center; }

  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 20px 28px; }
  .grp h4 { margin: 0 0 8px; display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 800; }
  .grp h4 span { color: var(--accent); }

  .st i { grid-column: 1 / -1; grid-row: 2; display: block; height: 4px; border-radius: 4px; background: var(--surface-2); position: relative; }
  .st i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: 4px; background: var(--accent); }
  .st b { color: var(--fg); text-align: right; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip.big { font-size: 0.8rem; padding: 6px 12px; }
  button.chip { border: 0; cursor: pointer; font-family: var(--font); }
  .lk { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 0; color: var(--fg); font: 700 0.82rem var(--font); border-radius: 999px; padding: 8px 14px 8px 10px; cursor: pointer; }
  .lk:hover { background: var(--accent-soft); color: var(--accent); }
  .lk img { width: 20px; height: 20px; object-fit: contain; }
  a.ext { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
  .dt .mode, .dt .build { padding: 0; }
  .chems { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 18px; }
  .chem { min-width: 0; background: var(--surface-2); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .chem-h { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .chem-h img { width: 30px; height: 30px; object-fit: contain; flex: none; }
  .chem-h small { display: block; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .chem-h span { font-weight: 800; overflow-wrap: anywhere; }
  .top { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .top li { display: grid; grid-template-columns: 18px 28px minmax(0, 1fr) auto 26px; gap: 8px; align-items: center; font-size: 0.82rem; }
  .top .rk { color: var(--muted); font-weight: 700; text-align: center; }
  .top .mini { width: 28px; height: 36px; object-fit: contain; }
  .top .pn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .pp { color: var(--muted); font-weight: 700; font-size: 0.72rem; }
  .top b { text-align: right; color: var(--accent); }
  @media (max-width: 420px) { .six { grid-template-columns: repeat(3, 1fr); } .plhead { grid-template-columns: auto minmax(0, 1fr); } .plimg { display: none; } }
  .sel { position: relative; display: inline-flex; flex: 0 0 auto; }
  .sel::after { content: ""; position: absolute; right: 18px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .sel select { appearance: none; -webkit-appearance: none; padding: 0 40px 0 18px; cursor: pointer; }
  input[type="search"], select { height: 42px; padding-block: 0; }
  .seg button { line-height: 1.2; }
  .sqb { all: unset; box-sizing: border-box; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; width: 100%; margin: 0 0 18px; padding: 22px 22px 20px; border-radius: 24px; color: #fff;
    background: linear-gradient(115deg, #05213d 0%, #0a4a73 34%, #0b8a87 68%, #35e3b2 100%); isolation: isolate; }
  .sqb::before, .sqb::after, .sqhero::before, .sqhero::after { content: ""; position: absolute; z-index: -1; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent); height: 2px; width: 140%; left: -20%; transform: rotate(-24deg); }
  .sqb::before, .sqhero::before { top: 62%; opacity: 0.55; }

<div class="wrap">
  <h1>Сборщик SBC в FC 27</h1>
  <p class="lead">Сколько кристаллов нужно для каждого SBC и во сколько монет обойдётся самая дешёвая сборка.</p>

  <div class="bar">
    <div class="seg" role="group" aria-label="Платформа">
      <button id="p-console" type="button" aria-pressed="true">PS / Xbox</button>
      <button id="p-pc" type="button" aria-pressed="false">ПК</button>
    </div>
    <input id="q" type="search" placeholder="Найти SBC" aria-label="Найти SBC">
    <div id="sortdd"></div>
  </div>
  <div class="seg cats" id="cats" role="group" aria-label="Категория"></div>
  <p class="upd" id="upd"></p>
  <button class="sqb" type="button" data-sqopen aria-label="Открыть Squad Builder">
    <span class="sqb-t"><span>SQUAD</span> <em>BUILDER</em></span>
    <span class="sqb-s">Тематические составы с максимальной сыгранностью</span>
    <span class="sqb-go">Собрать →</span>
  </button>

  <div class="grid" id="grid" aria-live="polite"></div>
  <p class="empty" id="empty" hidden>Ничего не найдено.</p>
  <p class="note" id="note"></p>
</div>
<div class="dt" id="squad" role="dialog" aria-modal="true" aria-label="Squad Builder" hidden><div class="dt-in" id="sqin"></div></div>
<div class="dt" id="detail" role="dialog" aria-modal="true" aria-label="Карточка SBC" hidden><div class="dt-in" id="dtin"></div></div>

<script>
  // Telegram Mini App: подгоняем тему, раскрываем окно, внешние ссылки открываем средствами Telegram
  (function () {
    var tg = window.Telegram && window.Telegram.WebApp;
    if (!tg || !tg.initData) return; // вне Telegram ничего не меняем
    try {

        if (best.some(function (p, j) { return j !== k2 && p.name === np.name; })) continue;
        var old = best[k2]; best[k2] = np;
        var v2 = objective(best);
        if (v2 > bestV) bestV = v2; else best[k2] = old;
      }
      return { form: f, squad: best, chem: chemList(best), v: bestV };
    }
    var res = null;
    if (SQ.form !== "auto" && FORMS[SQ.form]) res = tryForm(SQ.form, 120, 700);
    else {
      var all = Object.keys(FORMS).map(function (f) { return tryForm(f, 14, 140); }).filter(Boolean).sort(function (a, b) { return b.v - a.v; });
      if (all.length) { var again = tryForm(all[0].form, 80, 600); res = again && again.v > all[0].v ? again : all[0]; }
    }
    return res || { error: "Выбранные игроки не помещаются в схему по позициям. Попробуйте другую схему или других игроков." };
  }

  function sqSummary(res) {
    var cnt = { club: {}, league: {}, nation: {} };
    res.squad.forEach(function (p) { cnt.club[p.club] = (cnt.club[p.club] || 0) + 1; cnt.league[p.league] = (cnt.league[p.league] || 0) + 1; cnt.nation[p.nation] = (cnt.nation[p.nation] || 0) + 1; });
    var chips = "";
    [["club", "clubs", 2], ["nation", "nations", 2], ["league", "leagues", 3]].forEach(function (k) {
      Object.keys(cnt[k[0]]).filter(function (id) { return cnt[k[0]][id] >= k[2]; }).sort(function (a, b) { return cnt[k[0]][b] - cnt[k[0]][a]; }).forEach(function (id) {
        chips += '<span class="chip big lg">' + imgTag(LOGO + k[1] + "/" + id + ".png") + esc(sqName(k[0], id)) + ' ×' + cnt[k[0]][id] + '</span>';
      });
    });
    return chips;
  }

  function sqPitchHtml(res, title, note) {
    if (!res) return '';
    if (res.error) return '<section class="panel"><h3>' + title + '</h3><p class="none">' + esc(res.error) + '</p></section>';
    var total = res.chem.reduce(function (a, b) { return a + b; }, 0);
    var avg = Math.round(res.squad.reduce(function (a, p) { return a + p.rating; }, 0) / 11 * 10) / 10;
    var sp = res.squad.filter(function (p) { return p.sp; }).length;
    var capSum = res.squad.reduce(function (a, p) { return a + (p.pc || 0); }, 0), unk = res.squad.filter(function (p) { return !p.pc; }).length;
    var i = 0, rows = FORMS[res.form].map(function (row) {
      return '<div class="prow">' + row.map(function () {
        var p = res.squad[i], ch = res.chem[i]; i++;
        var pips = [0, 1, 2].map(function (k) { return '<i' + (k < ch ? ' on' : '') + '></i>'; }).join('');
        return '<div class="pc"><div class="pimg"><span class="pr">' + p.rating + '</span><span class="pp2">' + esc(p.pos) + '</span>' + imgTag("https://card-image.futmind.com/en/27/" + p.id + ".png") + '</div><b>' + esc(p.name) + '</b><span class="pips">' + pips + '</span></div>';
      }).join('') + '</div>';
    }).join('');
    return '<section class="panel"><h3>' + title + '</h3><p class="hint">' + note + '</p><div class="row sum"><span class="chip big">Схема ' + esc(res.form) + '</span><span class="chip big">Сыгранность ' + total + '/33</span><span class="chip big">Средний рейтинг ' + avg + '</span><span class="chip big">Особых карт ' + sp + '</span>' +
      (capSum ? '<span class="chip big">Цена до ' + sqFmtPrice(capSum) + (unk ? ' + ещё ' + unk + ' без оценки' : '') + '</span>' : '') + '</div>' +
      '<div class="pitch">' + rows + '</div><h3>Связи в составе</h3><div class="row">' + (sqSummary(res) || '<span class="none">Явных связей нет.</span>') + '</div></section>';
  }

  function sqResultHtml() {
    var r = SQ.results;
    if (!r) return '';
    return sqPitchHtml(r.rating, "Рейтинговый состав", "Максимум рейтинга и особых карточек при высокой сыгранности.") +
      sqPitchHtml(r.budget, "Бюджетный состав", "Дешёвые ценовые группы при высокой сыгранности. Цена здесь — верхняя оценка по группе («до 25 тыс.» и т. п.), а не точная цена.");
  }

  function sqRender(keepFocus) {
    var box = $("sqin"), back = '<button class="back" type="button" data-sqclose>← Назад</button>';
    var head = back + '<section class="sqhero"><div class="sqt"><span>SQUAD</span> <em>BUILDER</em></div><p>Тематические составы с максимальной сыгранностью. Выберите до трёх игроков, а я соберу два состава на выбор.</p></section>';
    if (SQ.db === null) { box.innerHTML = head + '<p class="none">Загружаю базу игроков…</p>'; return; }
    if (!SQ.db || !SQ.db.list.length) { box.innerHTML = head + '<section class="panel"><p class="none">База игроков ещё собирается. Она пополняется при каждом запуске обновления, загляните позже.</p></section>'; return; }
    var chips = SQ.anchors.map(function (a) {
      return '<button class="chip big lg" type="button" data-sqdel="' + a.id + '" aria-label="Убрать ' + esc(a.name) + '"><b>' + a.rating + '</b> ' + esc(a.name) + ' <span aria-hidden="true">×</span></button>';
    }).join('');
    var opts = [["auto", "Любая схема (подберу лучшую)"]].concat(Object.keys(FORMS).map(function (f) { return [f, f]; }));
    box.innerHTML = head + '<section class="panel"><h3>Игроки (до 3)</h3>' + (chips ? '<div class="row">' + chips + '</div>' : '') +
      (SQ.anchors.length < 3 ? '<input id="sqq" type="search" placeholder="Имя игрока, например Lionel Messi" autocomplete="off" value="' + esc(SQ.query) + '"><div id="sqhits"></div>' : '') +
      '<label class="chk"><input id="sqformer" type="checkbox"' + (SQ.former ? ' checked' : '') + '> Добавить бывшие клубы игроков (по другим их карточкам)</label>' +
      '<div class="row">' + ddHtml("form", opts, SQ.form) + '<button class="go" type="button" data-sqgo>Собрать составы</button><button class="go alt" type="button" data-sqrand>Случайный</button></div>' +
      (SQ.msg ? '<p class="warn" role="status">' + esc(SQ.msg) + '</p>' : '') +
      '<p class="hint">В расчёте игроки от серебра и выше. Сыгранность считается по клубу, лиге и нации, максимум 33.</p></section>' +
      '<div id="sqres">' + sqResultHtml() + '</div>';
    if (keepFocus) { var q = $("sqq"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  }
  function sqFind(text) {
    var t = nz(text).trim(), best = null, exact = null;
    if (!t) return null;
    SQ.db.list.forEach(function (p) {
      var n = nz(p.name);
      if (n === t && (!exact || p.rating > exact.rating)) exact = p;
      else if (n.indexOf(t) !== -1 && (!best || p.rating > best.rating)) best = p;
    });
    return exact || best;
  }
  function sqHits(text) {
    var t = nz(text).trim(), box = $("sqhits");
    if (!box) return;
    if (t.length < 2) { box.innerHTML = ''; return; }
    var hits = SQ.db.list.filter(function (p) { return nz(p.name).indexOf(t) !== -1; }).sort(function (a, b) { return b.rating - a.rating; }).slice(0, 8);
    box.innerHTML = hits.length ? '<ul class="hits">' + hits.map(function (p) {
      return '<li><button type="button" data-sqpick="' + p.id + '"><b>' + p.rating + '</b> ' + esc(p.name) + ' <small>' + esc(p.pos) + ' · ' + esc(sqName("club", p.club)) + (p.sp ? ' · ' + esc(p.rarity) : '') + '</small></button></li>';
    }).join('') + '</ul>' : '<p class="none">Такого игрока нет в базе: она пополняется при каждом обновлении.</p>';
  }
  function sqGo() {
    var q = $("sqq"), typed = q ? q.value.trim() : "";
    if (typed && SQ.anchors.length < 3) {
      var m = sqFind(typed);
      if (m && !SQ.anchors.some(function (a) { return a.name === m.name; })) { SQ.anchors.push(m); SQ.query = ""; }
      else if (!m) { SQ.msg = "Игрока «" + typed + "» нет в базе. Она пополняется при каждом обновлении (сейчас в ней " + SQ.db.list.length + " игроков)."; SQ.results = null; sqRender(); return; }
    }
    if (!SQ.anchors.length) { SQ.msg = "Введите имя игрока и выберите его из подсказок."; SQ.results = null; sqRender(); return; }
    SQ.msg = "";
    SQ.results = { rating: sqRun("rating"), budget: sqRun("budget") };
    sqRender();
    var el = $("sqres"); if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function sqRandom() {
    var specials = SQ.db.list.filter(function (p) { return p.sp && p.rating >= 85; });
    var pool = specials.length ? specials : SQ.db.list.filter(function (p) { return p.rating >= 80; });
    if (!pool.length) pool = SQ.db.list;
    SQ.anchors = [rnd(pool)]; SQ.query = ""; SQ.msg = "";
    sqGo();
  }

  function openSquad(fromHash) {
    SQ.open = true;
    $("squad").hidden = false;
    $("squad").scrollTop = 0;
    sqRender();
    sqLoad(function () { if (SQ.open) sqRender(); });
    if (!fromHash && location.hash !== "#squad") location.hash = "squad";
    if (tg && tg.BackButton) tg.BackButton.show();
  }
  function closeSquad(fromHash) {
    SQ.open = false;
    $("squad").hidden = true;
    if (tg && tg.BackButton) tg.BackButton.hide();
    if (!fromHash && location.hash === "#squad") history.back();
  }

  function syncHash() {
    var h = String(location.hash), m = /^#sbc-(\d+)$/.exec(h);
    if (m && state.data && findSbc(m[1])) { if (SQ.open) closeSquad(true); state.open = m[1]; renderDetail(); showBack(); }
    else if (h === "#squad") { if (state.open != null) closeDetail(true); if (!SQ.open) openSquad(true); }
    else { if (state.open != null) closeDetail(true); if (SQ.open) closeSquad(true); }
  }

  function render() {
    var d = state.data, q = $("q").value.trim().toLowerCase(), sort = state.sort;
    var counts = { all: d.sbcs.length, player: 0, pick: 0, pack: 0 };
    d.sbcs.forEach(function (s) { counts[(s.reward && s.reward.kind) || "pack"]++; });
    $("cats").innerHTML = CATS.map(function (c) { return '<button type="button" data-cat="' + c[0] + '" aria-pressed="' + (state.cat === c[0]) + '">' + c[1] + '<span class="n">' + counts[c[0]] + '</span></button>'; }).join('');
    var list = d.sbcs.filter(function (s) {
      var kind = (s.reward && s.reward.kind) || "pack";
      if (state.cat !== "all" && kind !== state.cat) return false;
      return !q || s.name.toLowerCase().indexOf(q) !== -1;
    });
    list.sort(function (a, b) {
      if (sort === "score-asc") return a.score - b.score;
      if (sort === "score-desc") return b.score - a.score;
      return (b.id || 0) - (a.id || 0);
    });
    $("grid").innerHTML = list.map(cardHtml).join('');
    $("empty").hidden = list.length > 0;
    if (state.open != null) renderDetail();
  }

  function setPlatform(p) {
    state.platform = p;
    $("p-console").setAttribute("aria-pressed", p === "console");
    $("p-pc").setAttribute("aria-pressed", p === "pc");
    render();
  }

  fetch("data.json").then(function (r) { return r.json(); }).then(function (d) {
    state.data = d;
    $("p-pc").disabled = d.platforms.indexOf("pc") === -1;
    if (d.platforms.indexOf("pc") === -1) $("p-pc").title = "Цены для ПК пока не собраны";
    try { $("upd").textContent = "Цены от " + new Date(d.updated).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Moscow" }) + " МСК"; } catch (e) {}
    $("note").textContent = "«Самый дешёвый» — минимум монет, обычно это много карт низкого рейтинга. «Оптимальный» — золотая середина: к цене каждой карты добавляется 300 монет за потраченное время, поэтому карт заметно меньше, а переплата умеренная. «Самый быстрый» — минимум карт: берутся карты, у которых цена за кристалл не больше чем в 1,5 раза выше самой выгодной, и среди них подбирается самая дешёвая сборка. Цены округлены до 50 монет и берутся по самой дешёвой карте на рынке; при массовой покупке реальная цена будет выше." + ((d.estimates || []).indexOf("pc") !== -1 ? " Цены для ПК приблизительные: они пересчитаны по соотношению цены SBC на ПК и консоли." : "") ;
    render();
    syncHash();
  }).catch(function () { $("empty").hidden = false; $("empty").textContent = "Не удалось загрузить data.json."; });

  $("p-console").onclick = function () { setPlatform("console"); };
  $("p-pc").onclick = function () { if (!this.disabled) setPlatform("pc"); };
  $("q").oninput = render;
  $("sortdd").innerHTML = ddHtml("sort", SORTS, state.sort);
  $("cats").onclick = function (e) { var c = e.target.getAttribute && e.target.closest("[data-cat]"); if (c) { state.cat = c.getAttribute("data-cat"); render(); } };
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.closest) return;
    if (t.closest("[data-sqopen]")) { openSquad(); return; }
    if (t.closest("[data-sqclose]")) { closeSquad(); return; }
    var db_ = t.closest(".dd-b");
    if (db_) {
      var dd = db_.parentNode, willOpen = !dd.classList.contains("open");
      closeDd(dd);
      dd.classList.toggle("open", willOpen);
      dd.querySelector(".dd-m").hidden = !willOpen;
      db_.setAttribute("aria-expanded", String(willOpen));
      return;
    }
    var dv = t.closest("[data-ddv]");
    if (dv) {
      var box = dv.closest(".dd"), kind = box.getAttribute("data-dd"), val = dv.getAttribute("data-ddv");
      closeDd();
      if (kind === "sort") { state.sort = val; box.outerHTML = ddHtml("sort", SORTS, val); render(); }
      else if (kind === "form") { SQ.form = val; sqRender(); }
      return;
    }
    closeDd();
    var sp = t.closest("[data-sqpick]");
    if (sp) {
      var id = Number(sp.getAttribute("data-sqpick")), pk = SQ.db.list.filter(function (p) { return p.id === id; })[0];
      if (pk && SQ.anchors.length < 3 && !SQ.anchors.some(function (a) { return a.name === pk.name; })) SQ.anchors.push(pk);
      SQ.query = ""; SQ.msg = ""; sqRender(true); return;
    }
    var sdel = t.closest("[data-sqdel]");
    if (sdel) { var did = Number(sdel.getAttribute("data-sqdel")); SQ.anchors = SQ.anchors.filter(function (a) { return a.id !== did; }); SQ.results = null; sqRender(); return; }
    if (t.closest("[data-sqgo]")) { sqGo(); return; }
    if (t.closest("[data-sqrand]")) { sqRandom(); return; }
    var o = t.closest("[data-open]");
    if (o) { openDetail(o.getAttribute("data-open")); return; }
    if (t.closest("[data-close]")) { closeDetail(); return; }
    var b = t.closest("[data-id]");
    if (!b) return;
    var id = b.getAttribute("data-id"), m = b.getAttribute("data-mode");
    if (m) state.mode[id] = m; else state.expanded[id] = !state.expanded[id];
    render();
    if (state.open != null) renderDetail();
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "sqq") { SQ.query = e.target.value; sqHits(e.target.value); }
  });
  document.addEventListener("change", function (e) {
    var id = e.target.id;
    if (id === "sqformer") SQ.former = e.target.checked;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.querySelector(".dd.open")) { closeDd(); return; }
    if (e.key === "Enter" && e.target.id === "sqq") { e.preventDefault(); sqGo(); return; }
    if (e.key === "Escape" && SQ.open) closeSquad();
    if (e.key === "Escape" && state.open != null) closeDetail();
    if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("data-open") && e.target.tagName === "DIV") { e.preventDefault(); openDetail(e.target.getAttribute("data-open")); }
  });
  window.addEventListener("hashchange", syncHash);
  if (tg && tg.BackButton) tg.BackButton.onClick(function () { if (SQ.open) closeSquad(); else closeDetail(); });
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сборщик SBC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  /* Макет: компактная шапка, ряд управления в виде таблеток, ниже спокойные карточки без рамок.
     Один акцент — цвет кристалла из иконки; всё остальное нейтральное. */
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-2: #eceef1;
    --fg: #12161b;
    --muted: #6a7482;
    --line: rgba(18, 22, 27, 0.08);
    --accent: #12967a;
    --accent-soft: rgba(18, 150, 122, 0.12);
    --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f12; --surface: #15181d; --surface-2: #1d2128; --fg: #eef1f4; --muted: #8a94a2;
      --line: rgba(255, 255, 255, 0.07); --accent: #5fd3b4; --accent-soft: rgba(95, 211, 180, 0.14);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f12; --surface: #15181d; --surface-2: #1d2128; --fg: #eef1f4; --muted: #8a94a2;
    --line: rgba(255, 255, 255, 0.07); --accent: #5fd3b4; --accent-soft: rgba(95, 211, 180, 0.14);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font: 500 15px/1.45 var(--font);
    font-variant-numeric: tabular-nums;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1160px; margin: 0 auto; }
  h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.035em; margin: 0 0 6px; text-wrap: balance; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }

  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .seg { display: inline-flex; gap: 2px; background: var(--surface); border-radius: 999px; padding: 4px; }
  .seg button {
    font: 700 0.84rem var(--font); color: var(--muted); background: none; border: 0;
    padding: 8px 16px; border-radius: 999px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .seg button:disabled { opacity: 0.35; cursor: not-allowed; }
  input[type="search"], select {
    font: 600 0.88rem var(--font); color: var(--fg); background: var(--surface);
    border: 0; border-radius: 999px; padding: 11px 18px; min-width: 0;
  }
  input[type="search"]::placeholder { color: var(--muted); }
  input[type="search"] { flex: 1 1 180px; max-width: 300px; }
  select { padding-right: 12px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .upd { color: var(--muted); font-size: 0.78rem; margin: 0 0 22px 4px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
  .card { background: var(--surface); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .art { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art::after { content: ""; position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(to bottom, transparent, var(--surface)); }
  .art .ph { font: 800 2.4rem var(--font); color: var(--muted); opacity: 0.5; }
  .body { padding: 0 20px 20px; margin-top: -6px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-width: 0; position: relative; z-index: 1; }
  .name { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; }
  .name a { color: inherit; text-decoration: none; }
  .name a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .need { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .need img { width: 22px; height: auto; flex: none; display: block; }
  .big { font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; color: var(--accent); line-height: 1; }
  .unit { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }

  .mode { display: flex; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
  .mode button {
    flex: 1; font: 700 0.72rem/1.15 var(--font); color: var(--muted); background: none; border: 0;
    padding: 7px 4px; border-radius: 999px; cursor: pointer; min-width: 0; text-align: center;
  }
  .mode button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }

  .build { display: flex; flex-direction: column; gap: 10px; }
  .cost { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .cost b { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.03em; }
  .cost .coin { color: var(--muted); font-size: 0.85rem; font-weight: 600; }
  .meta { margin: 0; color: var(--muted); font-size: 0.8rem; }
  ul.lines { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; font-size: 0.88rem; }
  ul.lines li { display: flex; justify-content: space-between; gap: 8px; }
  ul.lines .q { font-weight: 800; }
  ul.lines .p { color: var(--muted); white-space: nowrap; font-size: 0.82rem; }
  .more { font: 700 0.8rem var(--font); background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; text-align: left; }
  .none { color: var(--muted); font-size: 0.88rem; margin: 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .note { color: var(--muted); font-size: 0.76rem; margin-top: 32px; max-width: 80ch; }
  .cats { margin-bottom: 10px; }
  .cats button { padding: 8px 14px; }
  .cats .n { opacity: 0.6; font-weight: 600; margin-left: 4px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent); font: 700 0.8rem var(--font); border: 0; border-radius: 999px; padding: 7px 8px 7px 14px; cursor: pointer; margin: 0 0 14px; }
  .pill img { width: 16px; height: 16px; object-fit: contain; }
  .pill .x { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; font-size: 0.8rem; line-height: 1; }
  button.link { all: unset; cursor: pointer; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  button.link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .art[data-open] { cursor: pointer; }
  .tag { position: absolute; top: 10px; left: 10px; z-index: 2; font: 700 0.68rem var(--font); background: rgba(0, 0, 0, 0.55); color: #fff; padding: 3px 9px; border-radius: 999px; backdrop-filter: blur(6px); }

  .dt { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
  .dt-in {
    max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .back { align-self: flex-start; font: 700 0.85rem var(--font); background: var(--surface); color: var(--fg); border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  .dt .art { border-radius: 22px; }
  .dt .art::after { display: none; }
  .panel { background: var(--surface); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .panel h3 { margin: 0; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .dt h2.title { margin: 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; overflow-wrap: anywhere; }

  .plhead { display: flex; gap: 16px; align-items: center; }
  .plrate { font-size: 3.4rem; font-weight: 800; letter-spacing: -0.06em; line-height: 0.9; color: var(--accent); }
  .plpos { font-weight: 800; font-size: 0.95rem; margin-top: 4px; }
  .plname { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .plsub { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
  .plimg { margin-left: auto; width: 84px; flex: none; }
  .plimg img { width: 100%; height: auto; display: block; }
  .six { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .six div { background: var(--surface-2); border-radius: 14px; padding: 9px 4px; text-align: center; }
  .six b { display: block; font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
  .six span { font-size: 0.64rem; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 20px 28px; }
  .grp h4 { margin: 0 0 8px; display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 800; }
  .grp h4 span { color: var(--accent); }
  .st { display: grid; grid-template-columns: 1fr 28px; gap: 4px 10px; align-items: center; font-size: 0.82rem; color: var(--muted); font-weight: 600; margin-bottom: 7px; }
  .st i { grid-column: 1 / -1; grid-row: 2; display: block; height: 4px; border-radius: 4px; background: var(--surface-2); position: relative; }
  .st i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: 4px; background: var(--accent); }
  .st b { color: var(--fg); text-align: right; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip.big { font-size: 0.8rem; padding: 6px 12px; }
  button.chip { border: 0; cursor: pointer; font-family: var(--font); }
  .lk { display: inline-flex; align-items: center; gap: 8px; background: var(--surface-2); border: 0; color: var(--fg); font: 700 0.82rem var(--font); border-radius: 999px; padding: 8px 14px 8px 10px; cursor: pointer; }
  .lk:hover { background: var(--accent-soft); color: var(--accent); }
  .lk img { width: 20px; height: 20px; object-fit: contain; }
  a.ext { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
  .dt .mode, .dt .build { padding: 0; }
  @media (max-width: 420px) { .six { grid-template-columns: repeat(3, 1fr); } }
  @media (prefers-reduced-motion: no-preference) { .card { transition: transform .18s ease; } .card:hover { transform: translateY(-2px); } }
</style>

<div class="wrap">
  <h1>Сборщик SBC в FC 27</h1>
  <p class="lead">Сколько кристаллов нужно для каждого SBC и во сколько монет обойдётся самая дешёвая сборка.</p>

  <div class="bar">
    <div class="seg" role="group" aria-label="Платформа">
      <button id="p-console" type="button" aria-pressed="true">PS / Xbox</button>
      <button id="p-pc" type="button" aria-pressed="false">ПК</button>
    </div>
    <input id="q" type="search" placeholder="Найти SBC" aria-label="Найти SBC">
    <select id="sort" aria-label="Сортировка">
      <option value="new">Сначала новые</option>
      <option value="score-asc">Меньше кристаллов</option>
      <option value="score-desc">Больше кристаллов</option>
      <option value="cost-asc">Дешевле в монетах</option>
      <option value="cost-desc">Дороже в монетах</option>
    </select>
  </div>
  <div class="seg cats" id="cats" role="group" aria-label="Категория"></div>
  <p class="upd" id="upd"></p>
  <div id="filters"></div>

  <div class="grid" id="grid" aria-live="polite"></div>
  <p class="empty" id="empty" hidden>Ничего не найдено.</p>
  <p class="note" id="note"></p>
</div>
<div class="dt" id="detail" role="dialog" aria-modal="true" aria-label="Карточка SBC" hidden><div class="dt-in" id="dtin"></div></div>

  var nf = new Intl.NumberFormat("ru-RU");
  var state = { data: null, platform: "console", cat: "all", filter: null, expanded: {}, mode: {}, open: null };
  var $ = function (id) { return document.getElementById(id); };
  var tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function plural(n, a, b, c) { var m = n % 100, d = n % 10; return (m > 10 && m < 15) ? c : d === 1 ? a : (d > 1 && d < 5) ? b : c; }
  function hideImg(img) { img.style.display = "none"; }
  function imgTag(src, cls) { return src ? '<img ' + (cls ? 'class="' + cls + '" ' : '') + 'src="' + esc(src) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : ''; }
  function artHtml(s) {
    var first = esc(s.name.charAt(0)).replace(/'/g, "");
    return s.image ? '<img src="' + esc(s.image) + '" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'ph\',textContent:\'' + first + '\'}))">' : '<span class="ph">' + first + '</span>';
  }
  function chipsHtml(s) {
    var c = '';
    if (s.min_rating && s.min_rating > 45) c += '<span class="chip">карты от ' + s.min_rating + '</span>';
    (s.notes || []).filter(function (n) { return n.length <= 40; }).forEach(function (n) { c += '<span class="chip">' + esc(n) + '</span>'; });
    return c ? '<div class="chips">' + c + '</div>' : '';
  }

  // Режимы сборки и сама сборка (одинаково в карточке и на экране SBC)
  function buildHtml(s) {
    var pb = s.builds && s.builds[state.platform];
    var mode = state.mode[s.id] || "cheap";
    var b = pb && (pb[mode] || pb.cheap);
    var build;
    if (!b) {
      build = '<p class="none">Для этой платформы нет цен или нет подходящих карт.</p>';
    } else {
      var open = state.expanded[s.id], lines = b.lines, shown = open ? lines : lines.slice(0, 3);
      var meta = b.players + ' ' + plural(b.players, "карта", "карты", "карт") + (b.surplus ? ' · запас ' + nf.format(b.surplus) : '');
      if (b.estimate) meta += ' · оценка';
      var diff = '';
      if (mode !== "cheap" && pb.cheap) {
        var dc = b.cost - pb.cheap.cost, dn = pb.cheap.players - b.players;
        if (dn > 0) diff = '<p class="meta">На ' + nf.format(dn) + ' ' + plural(dn, "карту", "карты", "карт") + ' меньше, чем в дешёвой сборке, но на ' + nf.format(dc) + ' монет дороже.</p>';
      }
      build = '<div class="cost"><b>' + (b.estimate ? '≈ ' : '') + nf.format(b.cost) + '</b><span class="coin">монет</span></div>' +
        '<p class="meta">' + meta + '</p>' + diff +
        '<ul class="lines">' + shown.map(function (l) {
          return '<li><span><span class="q">' + nf.format(l.qty) + ' ×</span> ' + l.rating + ' ' + esc(RARITY[l.rarity] || l.rarity) + '</span><span class="p">по ' + nf.format(l.price) + '</span></li>';
        }).join('') + '</ul>' +
        (lines.length > 3 ? '<button class="more" type="button" data-id="' + s.id + '">' + (open ? 'Свернуть' : 'Ещё ' + (lines.length - 3)) + '</button>' : '');
    }
    function tab(m, label) { return '<button type="button" data-mode="' + m + '" data-id="' + s.id + '" aria-pressed="' + (mode === m) + '">' + label + '</button>'; }
    return '<div class="mode" role="group" aria-label="Способ сборки">' + tab("cheap", "Самый дешёвый") + tab("optimal", "Оптимальный") + tab("fast", "Самый быстрый") + '</div>' +
      '<div class="build">' + build + '</div>';
  }

  function cardHtml(s) {
    var kind = (s.reward && s.reward.kind) || "pack";
    return '<article class="card"><div class="art" data-open="' + s.id + '" role="button" tabindex="0" aria-label="Открыть ' + esc(s.name) + '">' + artHtml(s) + '<span class="tag">' + KIND[kind] + '</span></div><div class="body">' +
      '<h2 class="name"><button class="link" type="button" data-open="' + s.id + '">' + esc(s.name) + '</button></h2>' +
      '<div class="need">' + CRYSTAL + '<span class="big">' + nf.format(s.score) + '</span><span class="unit">кристаллов</span></div>' +
      chipsHtml(s) + buildHtml(s) + '</div></article>';
  }

  // Экран игрока: статы, позиции, стили игры и переходы по нации/лиге/клубу
  function playerHtml(pl) {
    var six = [["PAC", "pac"], ["SHO", "sho"], ["PAS", "pas"], ["DRI", "dri"], ["DEF", "def"], ["PHY", "phy"]].map(function (x) {
      return '<div><b>' + (pl[x[1]] != null ? pl[x[1]] : "—") + '</b><span>' + x[0] + '</span></div>';
    }).join('');
    var meta = [];
    if (pl.weak_foot) meta.push('слабая нога ' + pl.weak_foot + '★');
    if (pl.skill_moves) meta.push('финты ' + pl.skill_moves + '★');
    if (pl.foot) meta.push(pl.foot === "Left" ? 'левая нога' : 'правая нога');
    if (pl.height) meta.push(pl.height + ' см');
    var detail = pl.detail || {};
    var groups = GROUPS.map(function (g) {
      var rows = g[2].filter(function (k) { return detail[k] != null; }).map(function (k) {
        return '<div class="st"><span>' + esc(STAT_RU[k] || k) + '</span><b>' + detail[k] + '</b><i style="--w:' + Math.min(100, detail[k]) + '%"></i></div>';
      }).join('');
      return rows ? '<div class="grp"><h4>' + g[0] + '<span>' + (pl[g[1]] != null ? pl[g[1]] : '') + '</span></h4>' + rows + '</div>' : '';
    }).join('');
    var pos = Object.keys(pl.positions || {}).map(function (k) { return '<span class="chip big">' + k + ' ' + pl.positions[k] + '</span>'; }).join('');
    var styles = (pl.playstyles || []).map(function (k) { return '<span class="chip big">' + esc(k) + '</span>'; }).join('');
    function link(type, id, label, logo) {
      if (!id && !label) return '';
      var disabled = !id ? ' disabled' : '';
      return '<button class="lk" type="button" data-ftype="' + type + '" data-fid="' + (id || '') + '" data-flabel="' + esc(label || FTYPE[type]) + '" data-flogo="' + esc(logo || '') + '"' + disabled + '>' + imgTag(logo) + esc(label || FTYPE[type]) + '</button>';
    }
    var links = link("nation", pl.nation_id, pl.nation, pl.nation_logo) + link("league", pl.league_id, pl.league, pl.league_logo) + link("club", pl.club_id, "Клуб", pl.club_logo);
    return '<section class="panel"><h3>Игрок</h3>' +
      '<div class="plhead"><div><div class="plrate">' + (pl.rating || "—") + '</div><div class="plpos">' + esc(pl.position || "") + '</div></div>' +
      '<div><div class="plname">' + esc(pl.name) + '</div><div class="plsub">' + esc(pl.rarity || "") + '</div><div class="plsub">' + esc(meta.join(' · ')) + '</div></div>' +
      (pl.card_image ? '<div class="plimg">' + imgTag(pl.card_image) + '</div>' : '') + '</div>' +
      '<div class="six">' + six + '</div></section>' +
      (groups ? '<section class="panel"><h3>Характеристики</h3><div class="groups">' + groups + '</div></section>' : '') +
      (pos ? '<section class="panel"><h3>Рейтинг по позициям</h3><div class="row">' + pos + '</div></section>' : '') +
      (styles ? '<section class="panel"><h3>Стили игры</h3><div class="row">' + styles + '</div></section>' : '') +
      (links ? '<section class="panel"><h3>Все SBC с этой</h3><div class="row">' + links + '</div></section>' : '');
  }

  function detailHtml(s) {
    var rw = s.reward || { kind: "pack" }, kind = rw.kind;
    var reward;
    if (kind === "player") reward = rw.player ? playerHtml(rw.player) : '<section class="panel"><h3>Награда</h3><p class="none">Игрок. Его характеристики ещё не собраны.</p></section>';
    else if (kind === "pick") reward = '<section class="panel"><h3>Награда</h3><p class="none">Выбор игрока (пик). Какие именно игроки попадут в выбор, зависит от самого пика.</p></section>';
    else reward = '<section class="panel"><h3>Награда</h3><p class="none">Пак.</p></section>';
    return '<button class="back" type="button" data-close>← Назад</button>' +
      '<div class="art">' + artHtml(s) + '</div>' +
      '<section class="panel"><h2 class="title">' + esc(s.name) + '</h2>' +
      '<div class="need">' + CRYSTAL + '<span class="big">' + nf.format(s.score) + '</span><span class="unit">кристаллов</span></div>' +
      chipsHtml(s) + buildHtml(s) + '</section>' + reward +
      (s.url ? '<a class="ext" href="' + esc(s.url) + '" target="_blank" rel="noopener">Открыть на futmind ↗</a>' : '');
  }

  function findSbc(id) { return state.data && state.data.sbcs.filter(function (s) { return String(s.id) === String(id); })[0]; }

  function renderDetail() {
    var s = findSbc(state.open), box = $("detail");
    if (!s) { box.hidden = true; return; }
    var scroll = box.scrollTop;
    $("dtin").innerHTML = detailHtml(s);
    box.hidden = false;
    box.scrollTop = scroll;
  }
  function openDetail(id) {
    state.open = id;
    renderDetail();
    $("detail").scrollTop = 0;
    if (String(location.hash) !== "#sbc-" + id) location.hash = "sbc-" + id;
    if (tg && tg.BackButton) { tg.BackButton.show(); }
  }
  function closeDetail(fromHash) {
    state.open = null;
    $("detail").hidden = true;
    if (tg && tg.BackButton) tg.BackButton.hide();
    if (!fromHash && /^#sbc-/.test(location.hash)) history.back();
  }
  function syncHash() {
    var m = /^#sbc-(\d+)$/.exec(location.hash);
    if (m && state.data && findSbc(m[1])) { state.open = m[1]; renderDetail(); if (tg && tg.BackButton) tg.BackButton.show(); }
    else if (state.open != null) closeDetail(true);
  }

  function setFilter(f) { state.filter = f; closeDetail(); render(); window.scrollTo(0, 0); }
  function filterHtml() {
    var f = state.filter;
    if (!f) return '';
    return '<button class="pill" type="button" data-clear>' + imgTag(f.logo) + esc(FTYPE[f.type] + ': ' + f.label) + '<span class="x">×</span></button>';
  }

  function render() {
    var d = state.data, q = $("q").value.trim().toLowerCase(), sort = $("sort").value, f = state.filter;
    var counts = { all: d.sbcs.length, player: 0, pick: 0, pack: 0 };
    d.sbcs.forEach(function (s) { counts[(s.reward && s.reward.kind) || "pack"]++; });
    $("cats").innerHTML = CATS.map(function (c) { return '<button type="button" data-cat="' + c[0] + '" aria-pressed="' + (state.cat === c[0]) + '">' + c[1] + '<span class="n">' + counts[c[0]] + '</span></button>'; }).join('');
    $("filters").innerHTML = filterHtml();
    var list = d.sbcs.filter(function (s) {
      var kind = (s.reward && s.reward.kind) || "pack";
      if (state.cat !== "all" && kind !== state.cat) return false;
      if (f) { var pl = s.reward && s.reward.player; if (!pl || String(pl[f.type + "_id"]) !== String(f.id)) return false; }
      return !q || s.name.toLowerCase().indexOf(q) !== -1;
    });
    var cost = function (s) { var b = s.builds && s.builds[state.platform]; b = b && (b[state.mode[s.id] || "cheap"] || b.cheap); return b ? b.cost : Infinity; };
    list.sort(function (a, b) {
      if (sort === "score-asc") return a.score - b.score;
      if (sort === "score-desc") return b.score - a.score;
      if (sort === "cost-asc") return cost(a) - cost(b);
      if (sort === "cost-desc") return (cost(b) === Infinity ? -1 : cost(b)) - (cost(a) === Infinity ? -1 : cost(a));
      return (b.id || 0) - (a.id || 0);
    });
    $("grid").innerHTML = list.map(cardHtml).join('');
    $("empty").hidden = list.length > 0;
    if (state.open != null) renderDetail();
  }

  function setPlatform(p) {
    state.platform = p;
    $("p-console").setAttribute("aria-pressed", p === "console");
    $("p-pc").setAttribute("aria-pressed", p === "pc");
    render();
  }

  fetch("data.json").then(function (r) { return r.json(); }).then(function (d) {
    state.data = d;
    $("p-pc").disabled = d.platforms.indexOf("pc") === -1;
    if (d.platforms.indexOf("pc") === -1) $("p-pc").title = "Цены для ПК пока не собраны";
    try { $("upd").textContent = "Цены от " + new Date(d.updated).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Moscow" }) + " МСК"; } catch (e) {}
    $("note").textContent = "«Самый дешёвый» — минимум монет, обычно это много карт низкого рейтинга. «Оптимальный» — золотая середина: к цене каждой карты добавляется 300 монет за потраченное время, поэтому карт заметно меньше, а переплата умеренная. «Самый быстрый» — минимум карт: берутся карты, у которых цена за кристалл не больше чем в 1,5 раза выше самой выгодной, и среди них подбирается самая дешёвая сборка. Цены округлены до 50 монет и берутся по самой дешёвой карте на рынке; при массовой покупке реальная цена будет выше." + ((d.estimates || []).indexOf("pc") !== -1 ? " Цены для ПК приблизительные: они пересчитаны по соотношению цены SBC на ПК и консоли." : "") + " Источник данных: " + (d.source || "—") + ".";
    render();
    syncHash();
  }).catch(function () { $("empty").hidden = false; $("empty").textContent = "Не удалось загрузить data.json."; });

  $("p-console").onclick = function () { setPlatform("console"); };
  $("p-pc").onclick = function () { if (!this.disabled) setPlatform("pc"); };
  $("q").oninput = render;
  $("sort").onchange = render;
  $("cats").onclick = function (e) { var c = e.target.getAttribute && e.target.closest("[data-cat]"); if (c) { state.cat = c.getAttribute("data-cat"); render(); } };
  $("filters").onclick = function (e) { if (e.target.closest("[data-clear]")) { state.filter = null; render(); } };
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.closest) return;
    var o = t.closest("[data-open]");
    if (o) { openDetail(o.getAttribute("data-open")); return; }
    if (t.closest("[data-close]")) { closeDetail(); return; }
    var lk = t.closest("[data-ftype]");
    if (lk && lk.getAttribute("data-fid")) { setFilter({ type: lk.getAttribute("data-ftype"), id: lk.getAttribute("data-fid"), label: lk.getAttribute("data-flabel"), logo: lk.getAttribute("data-flogo") }); return; }
    var b = t.closest("[data-id]");
    if (!b) return;
    var id = b.getAttribute("data-id"), m = b.getAttribute("data-mode");
    if (m) state.mode[id] = m; else state.expanded[id] = !state.expanded[id];
    render();
    if (state.open != null) renderDetail();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && state.open != null) closeDetail();
    if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute && e.target.getAttribute("data-open") && e.target.tagName === "DIV") { e.preventDefault(); openDetail(e.target.getAttribute("data-open")); }
  });
  window.addEventListener("hashchange", syncHash);
  if (tg && tg.BackButton) tg.BackButton.onClick(function () { closeDetail(); });
</script>
